name: apx_pro
description: "APX PRO - Fitness, physiotherapy, rehabilitation, and posture correction platform."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3

  # Networking & API
  dio: ^5.4.1

  # Local Storage & Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.2

  # Security & Auth Utilities
  jwt_decoder: ^2.0.1

  # Media, Camera & File Picking
  video_player: ^2.8.2
  chewie: ^1.8.0
  youtube_player_iframe: ^6.0.2 # In-app YouTube playback (no external app); 6.x sends the referer YouTube now requires
  flutter_svg: ^2.0.9
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  url_launcher: ^6.3.0
  path: ^1.9.0

  # Firebase & Notifications
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  firebase_messaging: ^15.0.0

  # Payment Gateway
  razorpay_flutter: ^1.3.5

  # PDF Viewer (Android, iOS, Web via bundled PDFium WASM — no CDN required)
  pdfrx: ^1.2.0

  # Persistence
  shared_preferences: ^2.3.0

  # UI & Styling Helpers
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  fl_chart: ^0.66.0 # For progress charts and analytics

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1

  # App Icon Generation
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0B10"
  adaptive_icon_foreground: "assets/images/logo.png"
